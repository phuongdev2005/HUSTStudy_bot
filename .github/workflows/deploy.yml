name: Deploy HUSTStudy Bot to VPS

on:
  push:
    branches:
      - main  # Hoặc tên nhánh chính của bạn (ví dụ: master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ~/HUSTStudy_bot
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f  # Dọn dẹp các docker image cũ/thừa để tiết kiệm ổ cứng VPS
