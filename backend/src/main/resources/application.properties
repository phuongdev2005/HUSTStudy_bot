# ============================================================
#  HUSTStudy Bot – Application Configuration
#  Tất cả giá trị nhạy cảm đọc từ environment variable (.env)
# ============================================================

spring.application.name=huststudy-backend

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:huststudy_bot}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:studybot}
spring.datasource.password=${DB_PASSWORD:studybot1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
# none: Hibernate không làm gì với schema cả
# Flyway chịu trách nhiệm tạo/migrate bảng

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
# Flyway tự động chạy khi app khởi động

# ── Server ────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api

# ── Logging ───────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.studybot=DEBUG
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Google Sheets ─────────────────────────────────────────────
google.sheets.credentials-path=${GOOGLE_CREDENTIALS_PATH:classpath:google-credentials.json}
google.sheets.spreadsheet-id=${GOOGLE_SPREADSHEET_ID:}
google.sheets.application-name=HUSTStudy Bot
