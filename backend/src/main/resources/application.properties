# ============================================================
#  HUSTStudy Bot – Application Configuration
#  Tất cả giá trị nhạy cảm đọc từ environment variable (.env)
# ============================================================

spring.application.name=huststudy-backend

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:huststudy_bot}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:studybot}
spring.datasource.password=${DB_PASSWORD:studybot1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
# none: Hibernate không làm gì với schema cả
# Flyway chịu trách nhiệm tạo/migrate bảng

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Jackson JSON ───────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# ── Flyway ────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.repair-on-migrate=true
# Flyway tự động chạy khi app khởi động

# ── Server ────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api

# ── Logging ───────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.studybot=DEBUG
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ── Google Sheets ─────────────────────────────────────────────
# Dùng API Key (sheet phải set "Anyone with the link can view")
# Tạo API Key tại: https://console.cloud.google.com/ → APIs & Services → Credentials
google.sheets.api-key=${GOOGLE_API_KEY:}
google.sheets.application-name=HUSTStudy Bot

# Groq AI – Vision model scan bill (free tier 1000 req/ngày)
# Lấy tại: https://console.groq.com/keys
groq.api-key=${GROQ_API_KEY:}
groq.model=meta-llama/llama-4-scout-17b-16e-instruct
groq.free-daily-limit=10
